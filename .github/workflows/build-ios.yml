name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Verify Capacitor iOS SPM Manifests
        run: |
          echo "=== CapApp-SPM Package.swift ==="
          cat ios/App/CapApp-SPM/Package.swift
          echo "=== SplashScreen Package.swift ==="
          head -n 20 node_modules/@capacitor/splash-screen/Package.swift

      - name: Configure Manual Signing for CI
        run: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' ios/App/App.xcodeproj/project.pbxproj || true

      - name: Select Xcode 16
        run: |
          for app in /Applications/Xcode_16*.app; do
            if [ -d "$app" ]; then
              echo "Found Xcode 16 at $app"
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version

      - name: Resolve Package Dependencies
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -derivedDataPath build

      - name: Build iOS App (Device Binary)
        run: |
          cd ios/App
          set -o pipefail
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee build.log
        continue-on-error: false

      - name: Display Build Errors on Failure
        if: failure()
        run: |
          cd ios/App
          echo "==================== BUILD ERROR SUMMARY ===================="
          grep -E "error:|fatal:|The following build commands failed" build.log -A 2 -B 1 || true
          echo "==================== LAST 100 LINES OF LOG ===================="
          tail -n 100 build.log || true
          echo "### ❌ Xcode Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -E "error:|fatal:|The following build commands failed" build.log -A 2 -B 1 >> $GITHUB_STEP_SUMMARY || tail -n 50 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error:" build.log | head -n 25 | while IFS= read -r line; do
            clean_line=$(echo "$line" | tr -d '\r\n')
            echo "::error title=XcodeBuildError::$clean_line"
          done

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/App/build.log
          retention-days: 7

      - name: Package IPA
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r NexAce-CRM-unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexAce-CRM-iOS-IPA
          path: ios/App/build/Build/Products/Release-iphoneos/NexAce-CRM-unsigned.ipa
          retention-days: 14
